<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="55%" stop-color="#2e6bff"/>
      <stop offset="100%" stop-color="#7b5cff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="#05070d"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#g)" stroke-width="1.4" opacity="0.55"/>

  <g stroke="#00e5ff" stroke-width="1" opacity="0.18">
    <line x1="16" y1="0" x2="16" y2="64"/>
    <line x1="48" y1="0" x2="48" y2="64"/>
    <line x1="0" y1="22" x2="64" y2="22"/>
  </g>

  <text x="32" y="41" text-anchor="middle"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="26" font-weight="700"
        fill="url(#g)" filter="url(#glow)">SS</text>

  <circle cx="10" cy="10" r="2" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="54" cy="54" r="2" fill="#7b5cff" filter="url(#glow)"/>
</svg>
